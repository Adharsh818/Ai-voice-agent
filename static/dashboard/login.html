<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Staff sign in · Pearl Dental</title>
  <meta name="description" content="Staff sign in for the Pearl Dental dashboard.">
  <script src="/static/ui/head.js"></script>
  <link rel="stylesheet" href="/static/ui/emma-ui.css">
  <link rel="stylesheet" href="/dashboard/static/login.css">
</head>
<body class="signin">
  <div class="e-capsule-wrap" id="signin-capsule">
    <header class="e-capsule">
      <a class="e-capsule-brand" href="/" aria-label="Pearl Dental home">
        <span class="pearl" aria-hidden="true"></span>
        <span>Pearl Dental</span>
      </a>
      <div class="e-capsule-end">
        <a class="e-capsule-link" href="/">Talk to Emma</a>
      </div>
    </header>
  </div>

  <main class="signin-main">
    <div class="signin-brand" aria-hidden="true">
      <span class="pearl signin-mark"></span>
    </div>

    <div class="signin-column">
      <h1 class="signin-title">Staff sign in</h1>
      <p class="signin-sub">Pearl Dental dashboard</p>

      <div id="locked" class="signin-locked" role="status" hidden>
        <svg class="signin-lock" viewBox="0 0 16 20" aria-hidden="true" focusable="false">
          <path d="M4 8V5.5a4 4 0 0 1 8 0V8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <rect x="1.5" y="8" width="13" height="10.5" rx="2.5" fill="currentColor"/>
        </svg>
        <div>
          <p class="signin-locked-title">The dashboard is locked.</p>
          <p id="locked-reason" class="signin-locked-reason"></p>
        </div>
      </div>

      <form id="login-form" class="signin-form" autocomplete="on" hidden novalidate>
        <div class="signin-fields" id="field-group">
          <div class="e-field" id="username-field">
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder=" " aria-describedby="username-help">
            <label for="username">User name (optional)</label>
          </div>
          <div class="e-field" id="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder=" " aria-describedby="login-error">
            <label for="password">Password</label>
          </div>
        </div>
        <div class="signin-slot">
          <p id="login-error" class="e-error-line" role="alert" aria-live="polite" hidden></p>
          <p class="signin-help" id="username-help">Leave the user name empty to use the clinic password.</p>
        </div>
        <button class="e-block-btn signin-button" type="submit" id="login-button" aria-label="Sign in" disabled>
          <span class="e-btn-label">Sign in</span>
          <span class="e-spinner" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </button>
      </form>

      <p class="signin-note">
        <svg class="signin-lock small" viewBox="0 0 16 20" aria-hidden="true" focusable="false">
          <path d="M4 8V5.5a4 4 0 0 1 8 0V8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <rect x="1.5" y="8" width="13" height="10.5" rx="2.5" fill="currentColor"/>
        </svg>
        <span>Staff only. Every sign-in is recorded.</span>
      </p>
    </div>
  </main>

  <footer class="signin-footer">
    <div class="signin-footer-inner">
      <p>Pearl Dental · Staff dashboard</p>
      <p>Forgot the password? Ask the clinic owner.</p>
    </div>
  </footer>
  <script type="module" src="/dashboard/static/login.js"></script>
</body>
</html>
