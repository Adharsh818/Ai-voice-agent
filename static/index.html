<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl Dental Clinic — Emma AI Assistant</title>
    <meta name="description" content="Pearl Dental Clinic's AI-powered voice receptionist for seamless appointment booking.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app" id="app">
        <!-- Background Effects -->
        <div class="bg-gradient"></div>
        <div class="bg-particles" id="bgParticles"></div>

        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo-group">
                    <div class="logo-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" x2="12" y1="19" y2="22"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="logo-text">Pearl Dental Clinic</h1>
                        <p class="logo-subtitle">Emma — AI Virtual Assistant</p>
                    </div>
                </div>
                <div class="connection-badge" id="connectionBadge">
                    <span class="badge-dot"></span>
                    <span class="badge-text">Disconnected</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Conversation Panel -->
            <div class="conversation-panel" id="conversationPanel">
                <div class="conversation-scroll" id="conversationScroll">
                    <div class="welcome-message" id="welcomeMessage">
                        <div class="welcome-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" x2="12" y1="19" y2="22"/>
                            </svg>
                        </div>
                        <h2>Welcome to Pearl Dental Clinic</h2>
                        <p>Click the button below to start a voice conversation with Emma, your AI dental assistant.</p>
                    </div>
                    <!-- Messages will be inserted here -->
                </div>
            </div>

            <!-- Voice Visualizer -->
            <div class="visualizer-section" id="visualizerSection">
                <div class="orb-container" id="orbContainer">
                    <div class="orb" id="orb">
                        <div class="orb-ring orb-ring-1"></div>
                        <div class="orb-ring orb-ring-2"></div>
                        <div class="orb-ring orb-ring-3"></div>
                        <div class="orb-core"></div>
                    </div>
                </div>
                <canvas id="waveformCanvas" width="600" height="80"></canvas>
                <p class="status-text" id="statusText">Ready to connect</p>
            </div>
        </main>

        <!-- Footer Controls -->
        <footer class="footer">
            <div class="footer-content">
                <!-- Text input fallback -->
                <div class="text-input-group" id="textInputGroup" style="display:none;">
                    <input type="text" class="text-input" id="textInput" 
                           placeholder="Type your message..." autocomplete="off">
                    <button class="send-btn" id="sendBtn" title="Send message">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" x2="11" y1="2" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>

                <button class="connect-btn" id="connectBtn">
                    <span class="btn-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" x2="12" y1="19" y2="22"/>
                        </svg>
                    </span>
                    <span class="btn-text" id="connectBtnText">Start Conversation</span>
                </button>

                <button class="mode-toggle" id="modeToggle" title="Switch to text mode">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
