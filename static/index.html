<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Emma · Pearl Dental</title>
  <meta name="description" content="Talk to Emma at Pearl Dental's front desk.">
  <link rel="stylesheet" href="/static/ui/emma-ui.css">
  <link rel="stylesheet" href="/static/talk.css">
</head>
<body class="talk" data-call="idle">
  <header class="talk-nav glass-bar">
    <div class="talk-nav-inner">
      <span class="pearl" aria-hidden="true"></span>
      <span class="talk-nav-name">Pearl Dental</span>
      <a class="talk-nav-link" id="staff-link" href="/dashboard/" hidden>Staff</a>
    </div>
  </header>

  <main class="talk-main">
    <div class="hero-stack">
      <div class="hero" data-reveal>
        <h1 class="t-hero hero-title">Emma.</h1>
        <p class="t-subhead hero-sub">Pearl Dental's front desk. Tap to talk.</p>
      </div>
      <p class="call-status t-headline" id="call-status" aria-hidden="true"></p>
    </div>

    <button id="orb" data-state="idle" aria-label="Start call" aria-pressed="false">
      <span class="halo" aria-hidden="true"></span>
      <span class="ring" aria-hidden="true"></span>
      <span class="core" aria-hidden="true"></span>
      <span class="gloss" aria-hidden="true"></span>
    </button>

    <p id="caption" aria-live="polite"></p>

    <div class="cta" data-reveal-self>
      <button class="btn-pill" id="call-button" type="button">Call Emma</button>
      <button class="btn-pill outline" id="type-instead" type="button">Type instead</button>
      <button class="btn-pill" id="action" type="button" hidden>Try again</button>
    </div>

    <form id="typed" class="typed glass-pill" hidden autocomplete="off">
      <input id="typed-text" type="text" placeholder="Type what the caller says" aria-label="What the caller says">
      <button type="submit" class="typed-send" aria-label="Send">↑</button>
    </form>
  </main>

  <footer class="talk-footer">
    <p class="t-caption ink-2">Pearl Dental</p>
  </footer>
  <script type="module" src="/static/app.js"></script>
  <script type="module" src="/static/talk.js"></script>
</body>
</html>
