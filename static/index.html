<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Emma · Pearl Dental</title>
  <meta name="description" content="Talk to Emma at Pearl Dental's front desk.">
  <script src="/static/ui/head.js"></script>
  <link rel="stylesheet" href="/static/ui/emma-ui.css">
  <link rel="stylesheet" href="/static/talk.css">
</head>
<body class="talk" data-call="idle">
  <div class="e-capsule-wrap" id="talk-capsule">
    <header class="e-capsule">
      <a class="e-capsule-brand" href="/" aria-label="Pearl Dental">
        <span class="pearl" aria-hidden="true"></span>
        <span>Pearl Dental</span>
      </a>
      <div class="e-capsule-end">
        <a class="e-capsule-link" id="staff-link" href="/dashboard/" hidden>Staff</a>
      </div>
    </header>
  </div>

  <main class="talk-main">
    <div class="hero-stack">
      <div class="hero">
        <h1 class="hero-title">Emma.</h1>
        <p class="hero-sub">Pearl Dental's front desk.</p>
      </div>
      <p class="call-status" id="call-status" aria-hidden="true"></p>
    </div>

    <button id="orb" data-state="idle" aria-label="Start call" aria-pressed="false">
      <span class="halo" aria-hidden="true"></span>
      <span class="ring" aria-hidden="true"></span>
      <span class="core" aria-hidden="true"></span>
      <span class="rim" aria-hidden="true"></span>
      <span class="gloss" aria-hidden="true"></span>
      <span class="e-spinner orb-spinner" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </button>

    <div class="meter-slot" aria-hidden="true"><span class="e-meter" id="level-meter"></span></div>

    <!-- What was said: the caller's last line above, Emma's line below. app.js writes the live
         caption into #caption (read by screen readers); talk.js draws it here. -->
    <div class="transcript" id="transcript" aria-hidden="true">
      <span class="e-blur-scrim soft"></span>
      <p class="line-caller" id="line-caller"></p>
      <p class="line-emma" id="line-emma"></p>
    </div>
    <div class="sr-only"><p id="caption" aria-live="polite"></p></div>

    <div class="dock" id="dock">
      <div class="cta e-pillbar e-bubbles" id="call-bar">
        <button id="action" type="button" class="is-selected" hidden>Try again</button>
        <button id="call-button" type="button" class="is-selected">Call Emma</button>
        <button id="type-instead" type="button">Type instead</button>
      </div>
      <form id="typed" class="typed" hidden autocomplete="off">
        <input id="typed-text" type="text" placeholder="Type your message" aria-label="Your message to Emma" enterkeyhint="send">
        <button type="submit" class="typed-send" aria-label="Send">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 13V3.5M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </div>
  </main>
  <script type="module" src="/static/app.js"></script>
  <script type="module" src="/static/talk.js"></script>
</body>
</html>
