; Who may use Emma's SIP phones (pjsip.conf: acl=emma_phones). Rendered by
; tools/telephony_setup.py: loopback always; with --lan, the Wi-Fi subnet too.
; Everything else is refused before a password is even checked.

[emma_phones]
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
{{LAN_PERMIT}}
