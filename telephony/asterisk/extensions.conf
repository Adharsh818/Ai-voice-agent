; Emma's dialplan (docs/TELEPHONY.md). Rendered by tools/telephony_setup.py.
;
; Inbound: the call is registered with Emma over HTTP (its caller ID goes in the
; POST body, never the URL), which answers "busy" or the UUID for AudioSocket().
; When Emma's side closes, Emma says where the call goes next: "transfer" puts
; it through to the front desk (she has already written the callback task, so
; if nobody answers the caller is still called back).
;
; Outbound: recovery calls are placed by Emma with AMI Originate to the
; patient's phone; once answered, [emma-outbound] connects it with the UUID
; Emma passed in EMMA_UUID.

[globals]
EMMA_HTTP=http://127.0.0.1:{{SERVER_PORT}}
EMMA_KEY={{TELEPHONY_SECRET}}
EMMA_AUDIO=127.0.0.1:{{AUDIOSOCKET_PORT}}
FRONT_DESK={{TELEPHONY_FRONT_DESK}}

[from-phones]
exten => 100,1,Goto(emma-inbound,s,1)
exten => 1001,1,Dial(PJSIP/1001,30)
 same => n,Hangup()
exten => 1002,1,Dial(PJSIP/1002,30)
 same => n,Hangup()

[emma-inbound]
exten => s,1,Answer()
 same => n,Set(EMMA_UUID=${CURL(${EMMA_HTTP}/telephony/register,key=${EMMA_KEY}&from=${URIENCODE(${CALLERID(num)})})})
 same => n,GotoIf($["${EMMA_UUID}" = "busy"]?busy)
 same => n,GotoIf($[${LEN(${EMMA_UUID})} != 36]?down)
 same => n,AudioSocket(${EMMA_UUID},${EMMA_AUDIO})
 same => n,Set(EMMA_NEXT=${CURL(${EMMA_HTTP}/telephony/next,key=${EMMA_KEY}&uuid=${EMMA_UUID})})
 same => n,GotoIf($["${EMMA_NEXT}" = "transfer"]?transfer)
 same => n,Hangup()
 same => n(transfer),Dial(${FRONT_DESK},25)
 same => n,Hangup()
 same => n(busy),Playback(all-circuits-busy-now)
 same => n,Hangup()
 same => n(down),Playback(an-error-has-occurred)
 same => n,Hangup()

[emma-outbound]
exten => s,1,AudioSocket(${EMMA_UUID},${EMMA_AUDIO})
 same => n,Hangup()
