; Asterisk Manager Interface, for Emma's recovery calls (ami.py: Originate).
; Loopback only, one user that can place calls and see their outcome.

[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1

[{{AMI_USER}}]
secret = {{AMI_SECRET}}
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = call
write = originate,call
