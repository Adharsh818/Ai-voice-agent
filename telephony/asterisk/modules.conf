; Only what Emma's dialplan and phones use (docs/TELEPHONY.md). Loading
; everything the package ships (autoload=yes) never finished starting in WSL:
; voicemail-over-IMAP, LDAP and database drivers wait on servers that don't
; exist, so systemd timed out. A short list also means less code on the network.

[modules]
autoload = no

; Dialplan (extensions.conf) and the timing source bridges and playback need
load => pbx_config.so
load => res_timing_timerfd.so

; SIP phones: PJSIP with digest passwords, the acl.conf subnet, caller ID, keypad
load => res_sorcery_config.so
load => res_sorcery_memory.so
load => res_sorcery_astdb.so
load => res_pjproject.so
load => res_pjsip.so
load => res_pjsip_session.so
load => res_pjsip_pubsub.so
load => chan_pjsip.so
load => res_pjsip_authenticator_digest.so
load => res_pjsip_endpoint_identifier_user.so
load => res_pjsip_registrar.so
load => res_pjsip_acl.so
load => res_pjsip_nat.so
load => res_pjsip_sdp_rtp.so
load => res_pjsip_caller_id.so
load => res_pjsip_dtmf_info.so
load => res_pjsip_rfc3326.so
load => res_pjsip_dlg_options.so
load => res_pjsip_logger.so
load => res_rtp_asterisk.so
load => res_srtp.so

; Audio: G.722 (HD voice) and G.711 from the phones, 8/16 kHz for AudioSocket,
; GSM for the built-in "busy" / "error" prompts
load => codec_ulaw.so
load => codec_alaw.so
load => codec_g722.so
load => codec_resample.so
load => codec_gsm.so
load => format_gsm.so
load => format_wav.so
load => format_wav_gsm.so
load => format_pcm.so
load => format_sln.so

; Connecting calls (Dial, transfer to the front desk)
load => bridge_simple.so
load => bridge_native_rtp.so
load => bridge_builtin_features.so

; Applications and functions the dialplan calls
load => app_dial.so
load => app_playback.so
load => app_echo.so
load => app_audiosocket.so
load => res_audiosocket.so
load => res_curl.so
load => func_curl.so
load => func_uri.so
load => func_strings.so
load => func_callerid.so
load => func_channel.so
