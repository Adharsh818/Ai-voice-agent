; Emma's SIP phones (rendered by tools/telephony_setup.py into telephony/build/).
; Loopback only: with WSL2 mirrored networking, softphones on this Windows
; machine register to 127.0.0.1:5060 and nothing is exposed to the network.
;
;   1001  the caller / the demo patient (recovery calls ring it)
;   1002  the front desk (Emma's live transfers ring it)
; Dial 100 from either to talk to Emma.

[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

[phone](!)
type=endpoint
context=from-phones
disallow=all
allow=g722,ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[auth](!)
type=auth
auth_type=userpass

[aor](!)
type=aor
max_contacts=1
remove_existing=yes

; The caller ID is what Emma offers back ("Is the number you're calling from
; the best one?"): a DEMO number from docs/DEMO_SCRIPT.md, never a real one.
[1001](phone)
auth=1001
aors=1001
callerid="Neha Kapoor" <{{CALLER_NUMBER}}>

[1001](auth)
username=1001
password={{SIP_1001_PASSWORD}}

[1001](aor)

[1002](phone)
auth=1002
aors=1002
callerid="Front desk" <1002>

[1002](auth)
username=1002
password={{SIP_1002_PASSWORD}}

[1002](aor)
